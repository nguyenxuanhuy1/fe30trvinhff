# nginx.snippet.conf
# Snippet reverse proxy cho Next.js. Dán vào server block của site.
#
# Điểm quan trọng: camera cần secure context, nên bắt buộc HTTPS.
# localhost thì coi như đã secure, nhưng khi lên VPS phải có https thật.
#
# VỀ VIỆC CACHE: KHÔNG khai báo Cache-Control ở đây.
# next.config.ts đã gắn Cache-Control theo từng nhóm đường dẫn
# (/items/*.webp và /models và /vendor = immutable 1 năm; còn lại = no-cache).
# Khai báo thêm ở nginx sẽ ghi đè header của Next và dễ sai, nên để một chỗ
# duy nhất là ở Next.

# ---------------------------------------------------------------- TLS
# Camera (getUserMedia) chỉ chạy trên https hoặc localhost.
# Nếu nginx chỉ lắng nghe http thì bài thí nghiệm sẽ không mở được camera.

server {
    listen 80;
    server_name example.com;

    # ACME challenge không ép HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 2m;

    # wasm của MediaPipe là ~9MB không nén, phải gzip để tải cho đỡ nặng
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ----------------------------------------------------------------
    # Header bảo mật
    #
    # Khai báo add_header ở TRONG location sẽ khiến nginx bỏ hết các
    # add_header ở server block (nginx không gộp, chỉ thay thế). Vì vậy ở
    # đây không có location nào thêm add_header: tất cả nằm ở server block
    # để mọi đường dẫn nhận đủ.
    # ----------------------------------------------------------------

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Bài học nằm trong iframe của chính site này.
    # SAMEORIGIN thay vì DENY vì DENY sẽ chặn iframe ngay.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # camera=(self): chỉ trang của hệ thống này được dùng camera.
    # Không đặt Content-Security-Policy frame-ancestors 'none' - nếu có CSP
    # thì phải là frame-ancestors 'self'.
    add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self)" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------------------------------------------
    # App
    # ----------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/proxy-next.conf;
    }
}

# ---------------------------------------------------------------------
# /etc/nginx/snippets/proxy-next.conf
# Dùng chung cho mọi location proxy về Next. Tạo file riêng:
#
#   sudo tee /etc/nginx/snippets/proxy-next.conf > /dev/null <<'EOF'
#   proxy_http_version 1.1;
#   proxy_set_header Upgrade           $http_upgrade;
#   proxy_set_header Connection        'upgrade';
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Forwarded-Host  $host;
#   proxy_connect_timeout 10s;
#   proxy_send_timeout    60s;
#   proxy_read_timeout    60s;
#   proxy_buffering off;
#   EOF
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# Backend API: chỉ khi chạy chung domain. Frontend gọi API qua biến môi
# trường nên muốn đổi chỉ cần sửa .env, không cần sửa file này.
# ---------------------------------------------------------------------
#
# location /api/ {
#     proxy_pass http://127.0.0.1:8080;
#     include /etc/nginx/snippets/proxy-next.conf;
# }
#
# Nhớ khai báo NEXT_PUBLIC_API_URL trước khi build, ví dụ
# NEXT_PUBLIC_API_URL=https://example.com/api

# ---------------------------------------------------------------------
# Nếu chuyển Next sang output: 'standalone'
# ---------------------------------------------------------------------
# 1. Thêm vào next.config.ts:  output: "standalone"
# 2. `npm run build` tạo .next/standalone
# 3. Copy public/ và .next/static sang cạnh thư mục standalone:
#      cp -r public   .next/standalone/
#      cp -r .next/static .next/standalone/.next/
#    Bắt buộc copy public, nếu không sẽ mất /items, /models, /vendor,
#    /lab-sdk.js, /lab-lessons -> bài học trắng trang.
#    /vendor/tasks-vision nặng ~19MB, copy lâu nhưng cần thiết: thiếu thì
#    bài demo không tải được thư viện MediaPipe.
# 4. Chạy:  node .next/standalone/server.js
# 5. pm2:  pm2 start .next/standalone/server.js --name project30tr-web
#
# Ghi chú: nếu chạy standalone dưới subpath (vd /web),
# phải khai báo basePath và assetPrefix trong next.config.ts.
